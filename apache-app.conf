# Apache-Konfiguration der App, wird im Dockerfile nach conf-available/app.conf
# kopiert und mit a2enconf aktiviert.

ServerTokens Prod
ServerSignature Off

# Ohne ServerName meldet Apache beim Start zweimal AH00558 und rät den Namen
# aus der Container-IP. Fachlich harmlos, aber es verstellt das Log -- und beim
# Suchen nach einem echten Fehler will man dort nichts Überflüssiges sehen.
# Der öffentliche Name kommt ohnehin vom Nginx im Host-Header.
ServerName trainingsplan.local

# --- Reverse-Proxy -----------------------------------------------------------
# Der Host-Nginx (Proxmox-Host) spricht den Container ueber das interne Netz
# 10.10.10.0/24 an. Nur aus diesem Netz darf X-Forwarded-For uebernommen werden;
# von aussen ist der Port nicht erreichbar (Port-Binding an die LXC-IP).
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 10.10.10.0/24

# Zugriffslog mit der echten Client-IP (%a statt %h).
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" proxied
CustomLog /proc/self/fd/1 proxied

<Directory /var/www/html>
    Options -Indexes -ExecCGI +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# --- Nicht ausliefern --------------------------------------------------------
# Zusaetzlich zu den .htaccess-Dateien in lib/ und data/ (Guertel und Hosentraeger:
# die .htaccess wirkt nur, solange AllowOverride gesetzt bleibt).
<Directory /var/www/html/lib>
    Require all denied
</Directory>

<Directory /var/www/html/data>
    Require all denied
</Directory>

# --- Nicht ausliefern: Bau- und Konfigurationsdateien ------------------------
# Dockerfile, apache-app.conf und schema.sql landen je nach Bauweise im
# Webroot. Geheim ist keine davon, aber sie gehen niemanden etwas an -- und
# schema.sql verraet die komplette Datenstruktur. Die .dockerignore haelt sie
# beim Bau normalerweise heraus; das hier greift auch, wenn sie fehlt.
<FilesMatch "^(Dockerfile|\.dockerignore|.*\.(sql|conf|ya?ml|md|sh))$">
    Require all denied
</FilesMatch>

# --- Service Worker ----------------------------------------------------------
# sw.js liegt in assets/, soll aber die ganze Anwendung abdecken. Ohne diesen
# Header begrenzt der Browser den Geltungsbereich auf /assets/ und die
# installierte App bekaeme ihre eigenen Seiten nicht zu sehen.
<Files "sw.js">
    Header set Service-Worker-Allowed "/"
</Files>

# --- Uploads: statisch, aber niemals ausfuehrbar (§5) ------------------------
# Regulaerer Weg ist image.php mit Path-Jail; ein direkter Treffer auf eine
# hochgeladene Datei darf hoechstens ein Bild ausliefern, nie Code starten.
<Directory /var/www/html/uploads>
    Options -Indexes -ExecCGI
    AllowOverride None
    RemoveHandler .php .phtml .phar .php3 .php4 .php5 .php7 .php8
    RemoveType .php .phtml .phar .php3 .php4 .php5 .php7 .php8
    <FilesMatch "\.(?:ph(?:p[0-9]?|tml|ar)|cgi|pl|py|sh)$">
        SetHandler none
        Require all denied
    </FilesMatch>
</Directory>
