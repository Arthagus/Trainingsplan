# Apache-Konfiguration der App, wird im Dockerfile nach conf-available/app.conf
# kopiert und mit a2enconf aktiviert.

ServerTokens Prod
ServerSignature Off

# Ohne ServerName meldet Apache beim Start zweimal AH00558 und rät den Namen
# aus der Container-IP. Fachlich harmlos, aber es verstellt das Log -- und beim
# Suchen nach einem echten Fehler will man dort nichts Überflüssiges sehen.
# Der öffentliche Name kommt ohnehin vom Nginx im Host-Header.
ServerName trainingsplan.local

# --- Reverse-Proxy -----------------------------------------------------------
# Der Host-Nginx (Proxmox-Host) spricht den Container ueber das interne Netz
# 10.10.10.0/24 an. Nur aus diesem Netz darf X-Forwarded-For uebernommen werden;
# von aussen ist der Port nicht erreichbar (Port-Binding an die LXC-IP).
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 10.10.10.0/24

# Zugriffslog mit der echten Client-IP (%a statt %h).
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" proxied
CustomLog /proc/self/fd/1 proxied

<Directory /var/www/html>
    Options -Indexes -ExecCGI +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# --- Nicht ausliefern --------------------------------------------------------
# Zusaetzlich zu den .htaccess-Dateien in lib/ und data/ (Guertel und Hosentraeger:
# die .htaccess wirkt nur, solange AllowOverride gesetzt bleibt).
<Directory /var/www/html/lib>
    Require all denied
</Directory>

<Directory /var/www/html/data>
    Require all denied
</Directory>

# --- Nicht ausliefern: Bau- und Konfigurationsdateien ------------------------
# Dockerfile, apache-app.conf und schema.sql landen je nach Bauweise im
# Webroot. Geheim ist keine davon, aber sie gehen niemanden etwas an -- und
# schema.sql verraet die komplette Datenstruktur. Die .dockerignore haelt sie
# beim Bau normalerweise heraus; das hier greift auch, wenn sie fehlt.
#
# VERSION gehoert seit 1.0.10 dazu und ist der Grund, warum diese Liste eine
# Endung UND einen festen Namen kennt: Die Datei hat gar keine Endung und fiel
# deshalb durch jedes Muster. Bis 1.0.11 lieferte der Server sie an jeden aus,
# der sie anfragte -- gefunden beim Abgleich gegen die laufende Instanz. Wer
# hier eine Datei ohne Endung ins Wurzelverzeichnis legt, muss sie namentlich
# eintragen; die Endungsliste faengt sie nicht.
<FilesMatch "^(VERSION|Dockerfile|\.dockerignore|.*\.(sql|conf|ya?ml|md|sh))$">
    Require all denied
</FilesMatch>

# --- Service Worker ----------------------------------------------------------
# sw.js liegt in assets/, soll aber die ganze Anwendung abdecken. Ohne diesen
# Header begrenzt der Browser den Geltungsbereich auf /assets/ und die
# installierte App bekaeme ihre eigenen Seiten nicht zu sehen.
<Files "sw.js">
    Header set Service-Worker-Allowed "/"
</Files>

# --- Caching der Assets ------------------------------------------------------
# Ohne Cache-Control sendet Apache nur Last-Modified und ETag. Das ist NICHT
# "kein Caching": Fehlt jede Angabe zur Haltbarkeit, darf der Browser
# heuristisch cachen -- ueblich sind 10 % der Zeit seit Last-Modified, bei einer
# zwei Wochen alten Datei also rund anderthalb Tage ohne Rueckfrage.
#
# Das hat 1.1.7 am Smartphone gekostet. Der Ablauf im Einzelnen:
#   1. Neues Image ausgerollt, sw.js mit neuem Cache-Namen.
#   2. Der Service Worker installiert und ruft cache.addAll() -- das laeuft
#      durch den HTTP-Cache und bekam die ALTE style.css.
#   3. activate() loescht den vorherigen Cache.
#   4. Ergebnis: der frische Cache enthaelt den alten Stand, dauerhaft.
# Am PC fiel es nicht auf, weil dort hart neu geladen wurde.
#
# no-cache heisst nicht "nicht speichern", sondern "vor jeder Benutzung
# rueckfragen". Mit ETag kostet das ein 304 ohne Rumpf -- ein paar hundert Byte
# gegen die Gewissheit, dass ein Rollout ankommt. Bei einer App fuer eine
# Handvoll Leute ist das nicht einmal eine Abwaegung.
#
# Die Adressen tragen zusaetzlich ?v=<Version> (lib/view_header.php). Beides
# zusammen ist Absicht: Der Parameter macht alte Eintraege unerreichbar, dieser
# Header verhindert, dass ueberhaupt einer entsteht, den niemand erwartet.
<Directory /var/www/html/assets>
    Header set Cache-Control "no-cache"
</Directory>

# Dasselbe fuer die Seiten-Skripte im Wurzelverzeichnis (index.js und die
# uebrigen). Der Service Worker fasst sie nicht an -- er nimmt nur /assets/ --,
# der HTTP-Cache des Browsers aber sehr wohl.
<FilesMatch "\.js$">
    Header set Cache-Control "no-cache"
</FilesMatch>

# --- Uploads: statisch, aber niemals ausfuehrbar (§5) ------------------------
# Regulaerer Weg ist image.php mit Path-Jail; ein direkter Treffer auf eine
# hochgeladene Datei darf hoechstens ein Bild ausliefern, nie Code starten.
<Directory /var/www/html/uploads>
    Options -Indexes -ExecCGI
    AllowOverride None
    RemoveHandler .php .phtml .phar .php3 .php4 .php5 .php7 .php8
    RemoveType .php .phtml .phar .php3 .php4 .php5 .php7 .php8
    <FilesMatch "\.(?:ph(?:p[0-9]?|tml|ar)|cgi|pl|py|sh)$">
        SetHandler none
        Require all denied
    </FilesMatch>
</Directory>
