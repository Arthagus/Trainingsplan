# Host-Nginx auf dem Proxmox-Host, vorgelagert vor dem LXC 10.10.10.2.
#
# WORTGETREUE KOPIE der auf dem Root-Server aktiven Konfiguration
# (Stand 2026-08-06). Diese Datei ist Dokumentation des Ist-Zustands, keine
# Vorlage zum Ausrollen — sie wird nur nachgezogen, wenn der Server sich aendert.
# Verbesserungsvorschlaege stehen in doku/deployment.md, nicht hier drin.
#
# Ablage auf dem Server typischerweise unter
# /etc/nginx/sites-available/training.jadefalke.net mit Symlink nach sites-enabled/.
#
# Fuer die App entscheidend ist die Zeile "proxy_set_header X-Forwarded-Proto":
# intern laeuft die Verbindung unverschluesselt, $_SERVER['HTTPS'] ist im
# Container leer. Ohne diesen Header baut die App eine Redirect-Schleife und
# setzt kaputte Secure-Cookies (§5).

server {
        # Hier den Namen der Subdomain einsetzen
    server_name training.jadefalke.net;

    # allow large file uploads
    client_max_body_size 50000M;

    # Set headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # enable websockets: http://nginx.org/en/docs/http/websocket.html
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";

    # set timeout
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout       600s;

    location / {
        # Hier die interne IP und den Port einsetzen
        proxy_pass http://10.10.10.2:8066;

        # für moderne Apps ist "proxy_redirect off" besser, vorher aber prüfen
        proxy_redirect     default;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/training.jadefalke.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/training.jadefalke.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = training.jadefalke.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name training.jadefalke.net;
    return 404; # managed by Certbot


}
